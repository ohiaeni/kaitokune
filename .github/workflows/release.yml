name: Release

# v<MAJOR>.<MINOR>.<PATCH> のタグを push したら、ノートを自動生成して GitHub Release を作る。
# ノートの分類は .github/release.yml（PR のラベルごと）
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Release の作成に必要
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # トリガーの v*.*.* はワイルドカードなので、セマンティックバージョニングの形かをここで確かめる
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::タグ $TAG は v<MAJOR>.<MINOR>.<PATCH> の形式ではないため、Release を作りません"
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
