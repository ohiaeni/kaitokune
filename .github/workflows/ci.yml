name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action はタグの付け替えによる改ざんを防ぐためコミット SHA で固定する。
      # 末尾のバージョンコメントは Dependabot が SHA と一緒に更新する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm 11 以降（Node.js 24 に付属）でないと package.json の allowScripts が効かない。
      # バージョンは .node-version で手元と揃える
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint / Format
        run: npm run check

      # tsc -b（型チェック）+ vite build
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
